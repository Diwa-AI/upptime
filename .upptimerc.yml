# Change these first
owner: diwa-ai # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

sites:
  - name: Diwa AI
    url: https://www.diwa.ai
  - name: Diwa API
    url: https://www.diwa.ai/api/v1/health

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  #  cname: status.diwa.ai
  baseUrl: /upptime
  name: Status
  logoUrl: https://diwa-ai.github.io/upptime/diwa-logo.png
  themeUrl: https://diwa-ai.github.io/upptime/diwa-theme.css
  links:
    - rel: stylesheet
      href: https://diwa-ai.github.io/upptime/diwa-theme.css
  scripts:
    - src: https://diwa-ai.github.io/upptime/diwa-status.js
  navbar:
    - title: diwa.ai
      href: https://www.diwa.ai
  introMessage: >
    This page updates automatically from live checks against Diwa AI's
    public services.
  customHeadHtml: >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://diwa-ai.github.io/upptime/diwa-status.js" defer></script>
  metaTags:
    - name: theme-color
      content: "#050505"
  customFootHtml: >
    <p class="rss-subscribe">
      <a href="https://github.com/diwa-ai/upptime/issues.atom">Subscribe via RSS</a>
    </p>

# Root-level i18n is what Upptime merges into the status page
i18n:
  allSystemsOperational: All Systems Operational
  up: Operational
  pastIncidents: Past incidents
  overallUptime: "$UPTIME uptime"
  footer: "← [Back to diwa.ai](https://www.diwa.ai)"

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
